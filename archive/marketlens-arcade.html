<style>
  :root{
    --bg:#0d0f17; --panel:#161a28; --panel2:#1e2334; --ink:#eae7d6;
    --muted:#8b90a0; --gold:#ffce43; --green:#66d16b; --red:#e8595f;
    --blue:#5fb0f0; --line:#2b3145; --shadow:#000;
    --pixel:"Press Start 2P", ui-monospace, monospace;
    --term:"VT323", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--term); font-size:20px; line-height:1.15;
    -webkit-font-smoothing:none; image-rendering:pixelated;
  }
  /* CRT scanline veil */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  .crt::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.45) 100%);
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:22px 18px 60px; position:relative; z-index:1; }

  /* Cabinet header */
  .cab{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 20px; margin-bottom:20px;
        border-bottom:3px solid var(--line); padding-bottom:16px; }
  .logo{ font-family:var(--pixel); font-size:30px; letter-spacing:1px; color:var(--gold);
         text-shadow:3px 3px 0 var(--shadow); line-height:1.1; }
  .logo b{ color:var(--ink); font-weight:400; }
  .tag{ font-family:var(--pixel); font-size:9px; color:var(--muted); letter-spacing:2px;
        text-transform:uppercase; align-self:center; }
  .meta{ margin-left:auto; text-align:right; font-size:18px; color:var(--muted); }
  .meta b{ color:var(--green); }
  .blink{ color:var(--gold); }
  @media (prefers-reduced-motion:no-preference){ .blink{ animation:bl 1.1s steps(1) infinite; } }
  @keyframes bl{ 50%{ opacity:0; } }

  /* Stat tiles */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:760px){ .tiles{ grid-template-columns:repeat(2,1fr); } }
  .tile{ background:var(--panel); border:2px solid var(--line); box-shadow:5px 5px 0 var(--shadow);
         padding:12px 13px 13px; }
  .tile .k{ font-family:var(--pixel); font-size:8px; color:var(--muted); letter-spacing:1px;
            text-transform:uppercase; }
  .tile .v{ font-family:var(--pixel); font-size:16px; color:var(--gold); margin-top:12px;
            line-height:1.35; }
  .tile .s{ font-size:18px; color:var(--muted); margin-top:6px; }
  .tile.hot .v{ color:var(--green); }

  /* Controls */
  .controls{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
  .search{ flex:1 1 240px; display:flex; align-items:center; gap:10px;
           background:var(--panel); border:2px solid var(--line); box-shadow:4px 4px 0 var(--shadow);
           padding:8px 12px; }
  .search span{ font-family:var(--pixel); font-size:9px; color:var(--gold); }
  .search input{ flex:1; background:transparent; border:0; outline:none; color:var(--ink);
                 font-family:var(--term); font-size:20px; }
  .search input::placeholder{ color:var(--muted); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-family:var(--pixel); font-size:8px; letter-spacing:1px; text-transform:uppercase;
         color:var(--ink); background:var(--panel); border:2px solid var(--line);
         box-shadow:3px 3px 0 var(--shadow); padding:7px 9px; cursor:pointer; }
  .chip:hover{ border-color:var(--gold); }
  .chip[aria-pressed="true"]{ background:var(--gold); color:#161018; border-color:var(--gold);
         box-shadow:3px 3px 0 var(--shadow); }
  .chip:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  /* Ledger table */
  .tablewrap{ background:var(--panel); border:2px solid var(--line); box-shadow:6px 6px 0 var(--shadow);
              overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:720px; }
  thead th{ font-family:var(--pixel); font-size:8px; letter-spacing:1px; text-transform:uppercase;
            color:var(--gold); text-align:right; padding:12px 12px; background:var(--panel2);
            border-bottom:2px solid var(--line); cursor:pointer; white-space:nowrap; position:sticky; top:0; }
  thead th.l{ text-align:left; }
  thead th:hover{ color:var(--ink); }
  thead th .ar{ color:var(--muted); }
  tbody td{ padding:6px 12px; text-align:right; border-bottom:1px solid #20263a;
            font-variant-numeric:tabular-nums; white-space:nowrap; }
  tbody td.l{ text-align:left; }
  tbody tr:hover{ background:var(--panel2); }
  .name{ color:var(--ink); }
  .cat{ font-family:var(--pixel); font-size:7px; color:var(--muted); text-transform:uppercase;
        letter-spacing:1px; }
  .g{ color:var(--gold); } .gr{ color:var(--green); } .rd{ color:var(--red); } .mu{ color:var(--muted); }

  /* Demand meter */
  .meter{ display:inline-flex; gap:2px; vertical-align:middle; margin-right:8px; }
  .meter i{ width:6px; height:13px; background:#31374d; display:inline-block; }
  .meter i.on{ background:var(--green); }
  .meter i.hi{ background:var(--gold); }
  .dv{ display:inline-block; width:30px; text-align:right; }

  .foot{ padding:12px 14px; font-family:var(--pixel); font-size:8px; color:var(--muted);
         letter-spacing:1px; border-top:2px solid var(--line); background:var(--panel2); }
  .src{ margin-top:20px; font-size:16px; color:var(--muted); text-align:center; line-height:1.5; }
  .src a{ color:var(--blue); }
  .disc{ color:#6f7484; }
</style>

  function gs(cop){ // gold/silver for avg sale
    cop=Math.round(cop);
    var g=Math.floor(cop/10000), s=Math.floor((cop%10000)/100), c=cop%100;
    if(g>0) return g.toLocaleString()+"g "+s+"s";
    if(s>0) return s+"s "+c+"c";
    return c+"c";
  }
  function big(cop){ // compact gold, header carries the unit
    var g=Math.floor(cop/10000);
    if(g>=1e6) return (g/1e6).toFixed(1)+"M";
    if(g>=1e3) return Math.round(g/1e3)+"k";
    return ""+g;
  }
  function ago(iso){
    var t=Date.parse(iso); if(isNaN(t)) return iso;
    var h=Math.max(0,Math.round((Date.now()-t)/3.6e6));
    if(h<48) return h+"h ago";
    return Math.round(h/24)+"d ago";
  }
  function meter(d){
    var on=Math.round(d/10), h="";
    for(var i=0;i<10;i++) h += i<on ? '<i class="'+(d>=80?'hi':'on')+'"></i>' : '<i></i>';
    return h;
  }

  // ---- header + tiles ------------------------------------------------------
  document.getElementById('meta').innerHTML =
    'REGION <b>'+META.region.toUpperCase()+'</b> &middot; '+ITEMS.length.toLocaleString()+
    ' traded items<br>updated '+ago(META.updatedAt)+' <span class="blink">&#9608;</span>';

  var top = ITEMS.slice().sort(function(a,b){ return b.demand-a.demand; })[0];
  var catMove={}, turnover=0;
  ITEMS.forEach(function(it){
    catMove[it.cat]=(catMove[it.cat]||0)+it.spd;
    turnover += it.spd*it.asp;
  });
  var busiest=Object.keys(catMove).filter(function(c){return c!=="Other";})
    .sort(function(a,b){return catMove[b]-catMove[a];})[0];

  document.getElementById('tiles').innerHTML =
    tile("Items tracked", ITEMS.length.toLocaleString(), "with region sale data") +
    tile("Hottest item", top.name, "demand "+top.demand+"/100", true) +
    tile("Busiest market", busiest, Math.round(catMove[busiest]).toLocaleString()+" sold / day") +
    tile("Region turnover", big(turnover)+"g", "changing hands / day");
  function tile(k,v,s,hot){
    return '<div class="tile'+(hot?' hot':'')+'"><div class="k">'+k+'</div>'+
           '<div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>';
  }
  function esc(x){ return String(x).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

  // ---- chips ---------------------------------------------------------------
  var CATS=["All","Ore & Bars","Herbs","Cloth","Leather","Primals","Enchanting","Potions","Flasks","Elixirs","Cooking","Recipes","Bags","Other"];
  var curCat="All";
  var chipHtml = CATS.map(function(c){
    return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c==="All")+'">'+esc(c)+'</button>';
  }).join("");
  document.getElementById('chips').innerHTML = chipHtml;

  // ---- table head ----------------------------------------------------------
  var COLS=[
    {k:"name",  t:"Item",       l:true},
    {k:"cat",   t:"Market",     l:true},
    {k:"demand",t:"Demand"},
    {k:"sr",    t:"Rate"},
    {k:"spd",   t:"Sold/Day"},
    {k:"asp",   t:"Avg Sale (g/s)"},
    {k:"mv",    t:"Mkt Val (g)"}
  ];
  var sortKey="demand", sortDir=-1;
  function drawHead(){
    document.getElementById('head').innerHTML = COLS.map(function(c){
      var ar = c.k===sortKey ? '<span class="ar">'+(sortDir<0?"▼":"▲")+'</span>' : '';
      return '<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'">'+c.t+' '+ar+'</th>';
    }).join("");
  }

  // ---- render --------------------------------------------------------------
  var CAP=300, search="";
  function render(){
    var q=search.trim().toLowerCase();
    var rows=ITEMS.filter(function(it){
      if(curCat!=="All" && it.cat!==curCat) return false;
      if(q && it.name.toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    rows.sort(function(a,b){
      var x=a[sortKey], y=b[sortKey];
      if(typeof x==="string") return sortDir*x.localeCompare(y);
      return sortDir*(x-y);
    });
    var shown=rows.slice(0,CAP), html="";
    for(var i=0;i<shown.length;i++){
      var it=shown[i];
      var trend = it.mv>0 ? (it.asp/it.mv) : 1; // region avg vs market value (undercut hint)
      html +=
        '<tr><td class="l name">'+esc(it.name)+'</td>'+
        '<td class="l cat">'+esc(it.cat)+'</td>'+
        '<td><span class="meter">'+meter(it.demand)+'</span><span class="dv '+(it.demand>=80?'g':(it.demand>=45?'gr':'mu'))+'">'+it.demand+'</span></td>'+
        '<td class="'+(it.sr>=0.35?'gr':(it.sr<0.1?'rd':''))+'">'+Math.round(it.sr*100)+'%</td>'+
        '<td>'+ (it.spd>=10?Math.round(it.spd):it.spd.toFixed(1)) +'</td>'+
        '<td class="g">'+gs(it.asp)+'</td>'+
        '<td class="mu">'+big(it.mv)+'</td></tr>';
    }
    document.getElementById('rows').innerHTML = html ||
      '<tr><td class="l" colspan="7" style="padding:20px;color:var(--muted)">No items match.</td></tr>';
    document.getElementById('foot').textContent =
      "SHOWING "+shown.length.toLocaleString()+" OF "+rows.length.toLocaleString()+
      (rows.length>CAP?"  (TOP "+CAP+" — REFINE TO SEE MORE)":"");
  }

  // ---- events --------------------------------------------------------------
  document.getElementById('head').addEventListener('click', function(e){
    var th=e.target.closest('th'); if(!th) return;
    var k=th.getAttribute('data-k');
    if(k===sortKey){ sortDir=-sortDir; }
    else { sortKey=k; sortDir = (k==="name"||k==="cat")?1:-1; }
    drawHead(); render();
  });
  document.getElementById('chips').addEventListener('click', function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    curCat=b.getAttribute('data-cat');
    Array.prototype.forEach.call(this.children,function(c){
      c.setAttribute('aria-pressed', c===b ? "true":"false");
    });
    render();
  });
  document.getElementById('search').addEventListener('input', function(e){
    search=e.target.value; render();
  });

  drawHead(); render();
})();
</script>
