<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forever's First Weekend | WoWCensus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f8b700;--gold-lt:#ffd75a;--gold-dk:#b07a00;
  --ink:#2b1a0a;--brown:#5a2a00;--muted:#6a4a20;--rule:#9c7c42;
  --era:#b07a00;--tbc:#3f8a00;--sod:#7a28b0;--mop:#0f7f74;
  --drop:#a8200d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000}
body{font:11px/1.45 Verdana,Tahoma,Arial,sans-serif;color:var(--ink);padding:6px}

.frame{max-width:760px;margin:0 auto;border:2px solid #000;outline:1px solid #6a5022;
  background:linear-gradient(#2a1d0e,#1a1209);padding:0 0 6px}
.frame>h1{margin:0;padding:6px 8px;display:flex;align-items:center;gap:7px;
  font:700 13px 'Cinzel',serif;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;
  background:linear-gradient(#5a4220,#2a1d0e);border-bottom:1px solid #000;text-shadow:0 1px 0 #000}
.frame>h1 i{width:13px;height:13px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff2b0,#c88f10 50%,#4a2f00);border:1px solid #000}
.frame>h1 small{margin-left:auto;font:700 9px Tahoma,Arial,sans-serif;color:#cbb88a;letter-spacing:1px}

.sheet{margin:6px 6px 0;border:1px solid var(--rule);
  background:linear-gradient(#f8ecd0,#ecd9ad);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.hd{display:flex;align-items:flex-start;gap:7px;padding:6px 8px 5px;
  background:linear-gradient(#f8e7b5,#e3c682 70%,#cfae64);border-bottom:1px solid var(--rule)}
.hd .tack{width:24px;height:26px;flex:none;background:url('/wow2008/section-tack.png?v=37') center/contain no-repeat}
.hd h2{margin:0;font:700 16px/1.15 'Cinzel',serif;color:var(--brown);font-variant:small-caps}
.hd p{margin:1px 0 0;font-size:10px;color:var(--muted)}

.controls{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 10px 2px}
.group{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.group>span{font:700 9px Tahoma,Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:2px}
button{padding:3px 9px;font:bold 10px Verdana,sans-serif;color:#3a1a00;cursor:pointer;
  background:linear-gradient(#f6e7bf,#d4b878);border:1px solid #7a5a20;border-radius:2px;box-shadow:inset 0 1px 0 #fff8dc}
button:hover{filter:brightness(1.06)}
button[aria-pressed="true"]{background:linear-gradient(#6d4c21,#2a1a0a);border-color:#c69c4c;color:#ffdc8a;box-shadow:inset 0 0 6px #000}
button:focus-visible{outline:2px solid var(--gold-dk);outline-offset:1px}
button .sw{display:inline-block;width:8px;height:8px;margin-right:4px;border:1px solid #000;vertical-align:-1px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:8px 10px 2px}
.stat{background:rgba(255,248,225,.6);border:1px solid rgba(156,124,66,.6);padding:5px 7px}
.stat b{display:block;font:700 18px Tahoma,Arial,sans-serif;color:var(--drop)}
.stat span{font-size:9.5px;color:var(--muted)}

.chart{position:relative;padding:6px 10px 2px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:Verdana,Tahoma,Arial,sans-serif}
.row{cursor:default}
.row:hover .hit,.row:focus .hit{fill:rgba(255,215,90,.28)}
.row:focus{outline:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 10px 4px;font-size:9.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:9px;margin-right:4px;vertical-align:-1px;border:1px solid #2b1a0a}
.legend .b{background:repeating-linear-gradient(135deg,rgba(43,26,10,.18) 0 3px,rgba(43,26,10,.05) 3px 6px)}
.legend .a{background:#b07a00}

.tip{position:absolute;z-index:2;pointer-events:none;min-width:190px;max-width:260px;padding:6px 8px;
  background:linear-gradient(#2a1d0e,#140d06);border:1px solid #c69c4c;outline:1px solid #000;color:#e8dcc0;
  font-size:10px;box-shadow:0 3px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip h3{margin:0 0 3px;font:700 12px 'Cinzel',serif;color:var(--gold-lt)}
.tip .ed{font-size:9px;color:#cbb88a;text-transform:uppercase;letter-spacing:1px}
.tip table{width:100%;border-collapse:collapse;margin-top:4px}
.tip td{padding:1px 0}.tip td+td{text-align:right;color:#fff}
.tip .pct{font:700 13px Tahoma,Arial,sans-serif;color:#ff7a5a}
.tip .note{margin-top:4px;color:#b7a782;font-style:italic}

.note{margin:4px 10px 8px;padding:5px 7px;font-size:9.5px;color:var(--muted);border-top:1px solid rgba(156,124,66,.5)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 8px 0;font-size:9px;color:#8a7650}
.foot a{color:var(--gold);text-decoration:none;font-weight:bold}
.foot a:hover{color:#fff}

@media (max-width:520px){
  body{padding:0}
  .hd h2{font-size:14px}
  .frame>h1 small{display:none}
}
</style>
</head>
<body>
<div class="frame">
  <h1><i></i>WoW: Forever, week one<small>WOWCENSUS.IO</small></h1>
  <div class="sheet">
    <div class="hd"><div class="tack" aria-hidden="true"></div><div>
      <h2>Did Forever empty the old realms?</h2>
      <p>The same realms, swept the week before launch (Wed Nov 4) and again on the first weekend after it.</p>
    </div></div>

    <div class="controls">
      <div class="group" role="group" aria-label="Measure">
        <span>Measure</span>
        <button data-metric="who" aria-pressed="true">Characters seen</button>
        <button data-metric="ah" aria-pressed="false">Auction listings</button>
      </div>
      <div class="group" role="group" aria-label="View">
        <span>View</span>
        <button data-view="count" aria-pressed="true">Before &amp; after</button>
        <button data-view="pct" aria-pressed="false">% change</button>
      </div>
    </div>
    <div class="controls">
      <div class="group" role="group" aria-label="Edition" id="editions"><span>Edition</span></div>
    </div>

    <div class="summary" id="summary"></div>
    <div class="chart" id="chart"><div class="tip" id="tip" role="status" aria-live="polite"></div></div>
    <div class="legend" id="legend"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="foot"><span>Observed counts from WoWCensus addon sweeps, not official population figures.</span><a href="https://wowcensus.io" target="_blank" rel="noopener">wowcensus.io &rsaquo;</a></div>
</div>

<script>
(function(){
  var EDITIONS = {
    era: {name:'Classic Era',       color:'#b07a00'},
    tbc: {name:'TBC Anniversary',   color:'#3f8a00'},
    sod: {name:'Season of Discovery', color:'#7a28b0'},
    mop: {name:'MoP Classic',       color:'#0f7f74'}
  };
  var DATA = {
    who: [
      {ed:'tbc', realm:'Dreamscythe',       b:8933, bd:'Tue Nov 3',  a:1459, ad:'Sat Nov 7'},
      {ed:'tbc', realm:'Thunderstrike (EU)', b:8473, bd:'Wed Nov 4, before launch', a:1196, ad:'Sun Nov 8'},
      {ed:'era', realm:'Ashkandi',          b:5015, bd:'Wed Oct 28', a:1006, ad:'Sat Nov 7'},
      {ed:'era', realm:'Nethergarde Keep',  b:4713, bd:'Sun Nov 1',  a:516,  ad:'Sun Nov 8'},
      {ed:'era', realm:'Westfall',          b:3093, bd:'Tue Nov 3',  a:611,  ad:'Sun Nov 8'},
      {ed:'mop', realm:'Pagle (US)',        b:4270, bd:'Fri Oct 30', a:1161, ad:'Sat Nov 7'},
      {ed:'mop', realm:'Shek’zeer (EU)', b:666, bd:'Sun Nov 1', a:576,  ad:'Sun Nov 8'},
      {ed:'sod', realm:'Wild Growth (EU)',  b:1008, bd:'Sun Nov 1',  a:37,   ad:'Sun Nov 8',
        note:'Complete sweeps with similar query counts on both days.'},
      {ed:'sod', realm:'Wild Growth (US)',  b:869,  bd:'Sun Nov 1',  a:42,   ad:'Sat Nov 7',
        note:'Complete sweeps with similar query counts on both days.'}
    ],
    ah: [
      {ed:'tbc', realm:'Dreamscythe', b:117925, bd:'Wed Nov 4', a:67661, ad:'Thu Nov 5, morning',
        note:'Last comparable scan was the day after launch; no weekend scan yet.'},
      {ed:'era', realm:'Westfall',    b:38872,  bd:'Tue Nov 3', a:22378, ad:'Sun Nov 8'}
    ]
  };
  var NOTES = {
    who:'Characters our /who sweeps saw, both factions. Sweep hours differ and some earlier sweeps hit the /who result cap, so these show a large observed drop, not exactly how much of it Forever caused.',
    ah:'Active auction listings in a single scan, both factions: a snapshot, not a count of sales. No comparable after-launch scans exist yet for Season of Discovery or MoP Classic.'
  };

  var state = {metric:'who', view:'count', eds:{era:1,tbc:1,sod:1,mop:1}};
  var chart = document.getElementById('chart'), tip = document.getElementById('tip');
  var fmt = function(n){return n.toLocaleString('en-US');};
  var pct = function(r){return (r.a - r.b) / r.b * 100;};
  var pctTxt = function(p){return (p < 0 ? '−' : '+') + Math.abs(Math.round(p)) + '%';};

  // Edition chips
  var edWrap = document.getElementById('editions');
  Object.keys(EDITIONS).forEach(function(k){
    var b = document.createElement('button');
    b.dataset.ed = k; b.setAttribute('aria-pressed','true');
    b.innerHTML = '<span class="sw" style="background:'+EDITIONS[k].color+'"></span>' + EDITIONS[k].name;
    edWrap.appendChild(b);
  });

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.metric){state.metric = b.dataset.metric;}
    else if(b.dataset.view){state.view = b.dataset.view;}
    else if(b.dataset.ed){
      var on = Object.keys(state.eds).filter(function(k){return state.eds[k];});
      if(state.eds[b.dataset.ed] && on.length === 1){ // last one on: show all again
        Object.keys(state.eds).forEach(function(k){state.eds[k]=1;});
      } else state.eds[b.dataset.ed] = state.eds[b.dataset.ed] ? 0 : 1;
    } else return;
    render();
  });

  function rows(){
    var r = DATA[state.metric].filter(function(d){return state.eds[d.ed];});
    if(state.view === 'pct') r = r.slice().sort(function(x,y){return pct(x)-pct(y);});
    return r;
  }

  function summary(){
    var el = document.getElementById('summary'), html = '';
    var all = DATA[state.metric];
    Object.keys(EDITIONS).forEach(function(k){
      var g = all.filter(function(d){return d.ed===k;});
      if(!g.length || !state.eds[k]) return;
      var b = g.reduce(function(s,d){return s+d.b;},0), a = g.reduce(function(s,d){return s+d.a;},0);
      html += '<div class="stat" style="border-left:4px solid '+EDITIONS[k].color+'"><b>'+pctTxt((a-b)/b*100)+'</b><span>'+EDITIONS[k].name+
        ' · '+g.length+' realm'+(g.length>1?'s':'')+' combined<br>'+fmt(b)+' → '+fmt(a)+'</span></div>';
    });
    el.innerHTML = html;
  }

  function render(){
    document.querySelectorAll('[data-metric]').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.metric===state.metric);});
    document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.view===state.view);});
    document.querySelectorAll('[data-ed]').forEach(function(b){
      var has = DATA[state.metric].some(function(d){return d.ed===b.dataset.ed;});
      b.hidden = !has; b.setAttribute('aria-pressed', !!state.eds[b.dataset.ed]);
    });
    summary();
    document.getElementById('note').textContent = NOTES[state.metric];
    document.getElementById('legend').innerHTML = state.view === 'count'
      ? '<span><i class="b"></i>Before launch</span><span><i class="a"></i>After launch (edition colour)</span><span>Hover or tap a realm for dates</span>'
      : '<span>Bar length = share lost between the two sweeps. Hover or tap a realm for the counts.</span>';
    draw();
    resize();
  }

  function draw(){
    hideTip();
    var data = rows();
    var W = Math.max(300, chart.clientWidth - 20);
    var narrow = W < 480;
    var labelW = narrow ? 118 : 150;
    var right = state.view === 'count' ? (narrow ? 72 : 90) : (narrow ? 42 : 54);
    var rowH = state.view === 'count' ? 34 : 26, top = 18;
    var plotW = W - labelW - right;
    var H = top + data.length * rowH + 6;
    var ns = 'http://www.w3.org/2000/svg';
    var max = Math.max.apply(null, data.map(function(d){return d.b;}).concat([1]));
    var nice = niceMax(max);
    var x = state.view === 'count'
      ? function(v){return labelW + v / nice * plotW;}
      : function(v){return labelW + v / 100 * plotW;};

    var s = '<svg xmlns="'+ns+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+
      (state.view==='count'?'Before and after counts':'Percent change')+' by realm">';
    s += '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
      '<rect width="6" height="6" fill="rgba(43,26,10,.06)"/><rect width="3" height="6" fill="rgba(43,26,10,.16)"/></pattern></defs>';

    // grid + axis
    var ticks = state.view === 'count' ? [0, nice/4, nice/2, nice*3/4, nice] : [0,25,50,75,100];
    ticks.forEach(function(t){
      var xx = x(t);
      s += '<line x1="'+xx+'" x2="'+xx+'" y1="'+(top-4)+'" y2="'+(H-4)+'" stroke="rgba(156,124,66,.35)" stroke-dasharray="2 3"/>';
      s += '<text x="'+xx+'" y="10" font-size="8.5" fill="#6a4a20" text-anchor="middle">'+
        (state.view==='count' ? short(t) : (t ? '−'+t+'%' : '0'))+'</text>';
    });

    data.forEach(function(d,i){
      var y = top + i * rowH, c = EDITIONS[d.ed].color, p = pct(d);
      s += '<g class="row" tabindex="0" data-i="'+i+'" aria-label="'+esc(d.realm)+': '+fmt(d.b)+' before, '+fmt(d.a)+' after, '+pctTxt(p)+'">';
      s += '<rect class="hit" x="0" y="'+(y+1)+'" width="'+W+'" height="'+(rowH-2)+'" fill="transparent"/>';
      s += '<rect x="2" y="'+(y+rowH/2-6)+'" width="4" height="12" fill="'+c+'"/>';
      s += '<text x="11" y="'+(y+rowH/2-(state.view==='count'?2:-3))+'" font-size="'+(narrow?9.5:11)+'" font-weight="bold" fill="#3a1a00">'+esc(d.realm)+'</text>';
      if(state.view === 'count'){
        s += '<text x="11" y="'+(y+rowH/2+9)+'" font-size="8.5" fill="#6a4a20">'+EDITIONS[d.ed].name+'</text>';
        var bh = 10;
        s += '<rect x="'+labelW+'" y="'+(y+rowH/2-bh-1)+'" width="'+Math.max(1,x(d.b)-labelW)+'" height="'+bh+'" fill="url(#hatch)" stroke="#5a3a10" stroke-width=".8"/>';
        s += '<rect x="'+labelW+'" y="'+(y+rowH/2+1)+'" width="'+Math.max(1.5,x(d.a)-labelW)+'" height="'+bh+'" fill="'+c+'" stroke="#2b1a0a" stroke-width=".8"/>';
        s += '<text x="'+(x(d.b)+4)+'" y="'+(y+rowH/2-3)+'" font-size="8.5" fill="#6a4a20">'+fmt(d.b)+'</text>';
        s += '<text x="'+(x(d.a)+4)+'" y="'+(y+rowH/2+9)+'" font-size="8.5" font-weight="bold" fill="#2b1a0a">'+fmt(d.a)+'</text>';
      } else {
        var w = Math.abs(p)/100*plotW;
        s += '<rect x="'+labelW+'" y="'+(y+rowH/2-7)+'" width="'+plotW+'" height="14" fill="rgba(43,26,10,.06)"/>';
        s += '<rect x="'+labelW+'" y="'+(y+rowH/2-7)+'" width="'+w+'" height="14" fill="'+c+'" stroke="#2b1a0a" stroke-width=".8"/>';
      }
      s += '<text x="'+(W-2)+'" y="'+(y+rowH/2+4)+'" font-size="'+(narrow?11:12)+'" font-weight="bold" fill="#a8200d" text-anchor="end" font-family="Tahoma,Arial,sans-serif">'+pctTxt(p)+'</text>';
      s += '</g>';
    });
    s += '</svg>';

    var old = chart.querySelector('svg'); if(old) old.remove();
    chart.insertAdjacentHTML('beforeend', s);
    chart.querySelectorAll('.row').forEach(function(g){
      var d = data[+g.dataset.i];
      var show = function(ev){showTip(d, g, ev);};
      g.addEventListener('mousemove', show);
      g.addEventListener('focus', show);
      g.addEventListener('click', show);
      g.addEventListener('mouseleave', hideTip);
      g.addEventListener('blur', hideTip);
    });
  }

  function showTip(d, g, ev){
    var unit = state.metric === 'who' ? 'characters seen' : 'listings';
    tip.innerHTML = '<div class="ed">'+EDITIONS[d.ed].name+'</div><h3>'+esc(d.realm)+'</h3>'+
      '<table><tr><td>'+d.bd+'</td><td>'+fmt(d.b)+'</td></tr><tr><td>'+d.ad+'</td><td>'+fmt(d.a)+'</td></tr></table>'+
      '<div style="margin-top:3px"><span class="pct">'+pctTxt(pct(d))+'</span> '+unit+' · '+fmt(d.b-d.a)+' fewer</div>'+
      (d.note ? '<div class="note">'+d.note+'</div>' : '');
    var cr = chart.getBoundingClientRect(), gr = g.getBoundingClientRect();
    var px = ev && ev.clientX ? ev.clientX - cr.left : cr.width/2;
    tip.classList.add('on');
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.min(Math.max(4, px + 14), cr.width - tw - 4);
    var topPx = gr.bottom - cr.top + 4;
    if(topPx + th > chart.offsetHeight) topPx = gr.top - cr.top - th - 4;
    tip.style.left = left + 'px'; tip.style.top = Math.max(0, topPx) + 'px';
  }
  function hideTip(){tip.classList.remove('on');}

  function niceMax(v){var e = Math.pow(10, Math.floor(Math.log10(v))), m = v/e; return (m<=2?2:m<=2.5?2.5:m<=5?5:10)*e;}
  function short(v){return v>=1000 ? (v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k' : String(v);}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // Tell a parent page our height so the iframe can fit without scrolling.
  function resize(){
    try{ parent.postMessage({wowcensusEmbed:'forever-week-one', height:document.documentElement.scrollHeight}, '*'); }catch(e){}
  }
  var rt; window.addEventListener('resize', function(){clearTimeout(rt); rt = setTimeout(function(){draw(); resize();}, 80);});
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  render();
})();
</script>
</body>
</html>
