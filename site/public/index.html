<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketLens Arcade</title>
<meta name="description" content="8-bit auction-house market screener built from MarketLens addon realm scans.">
<!-- Machine-readable data. The screener table on this page is filled client-side
     from the JSON API, so a non-JS fetch of this HTML sees only a placeholder.
     Read the data directly instead:
       /api/games                      list every uploaded realm dataset
       /api/items?game=<game>          latest market snapshot (see its `columns`)
       /api/history?game=<game>&id=<n> daily price/quantity series for one item
       /api/population?game=realm:<realm>  observed class/race/demand survey
     <game> is a realm key like "realm:Ashkandi-Alliance".
     See /llms.txt for the full field reference. -->
<link rel="alternate" type="application/json" href="/api/games" title="Datasets (JSON)">
<link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="cab">
    <a class="logo" href="/">MARKET<b>LENS</b></a>
    <div class="tag">Realm Screener</div>
    <div class="meta" id="meta">loading&hellip; <span class="blink">&#9608;</span></div>
  </header>

  <nav class="games" id="games" aria-label="dataset"></nav>

  <section class="tiles" id="tiles"></section>

  <section class="controls">
    <label class="search">
      <span>FIND&#9608;</span>
      <input id="search" type="text" placeholder="search item name..." autocomplete="off" spellcheck="false">
    </label>
    <div class="chips" id="chips"></div>
  </section>

  <div class="tablewrap">
    <table>
      <colgroup id="cols"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"><tr><td class="l" colspan="5" style="padding:22px;color:var(--muted)">Loading realm data&hellip;</td></tr></tbody>
    </table>
    <div class="foot" id="foot"></div>
  </div>

  <p class="src">
    Qty change compares each item's listed quantity with the scan before it &mdash; listings, not observed sales.<br>
    Data: MarketLens addon auction house scans. Click any item for price history.
  </p>
</div>
<!-- Wowhead item icons + authentic hover tooltips. iconizeLinks turns the empty
     per-row <a class="ic"> links into icons; renameLinks off so our own name
     links keep their text. The /tbc/, /classic/ path on each link tells the
     script which game data to use, so one script serves every dataset. -->
<script>const whTooltips = { colorLinks: false, iconizeLinks: true, renameLinks: false };</script>
<script src="https://wow.zamimg.com/js/tooltips.js" defer></script>
<script src="/app.js?v=qty-change-1"></script>
</body>
</html>
