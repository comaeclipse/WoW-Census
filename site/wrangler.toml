name = "marketlens"
main = "src/worker.js"
compatibility_date = "2024-11-06"

# Static assets (index page, styles, client script) live in ./public
[assets]
directory = "public"
binding = "ASSETS"

# D1 database. Create it with:  wrangler d1 create marketlens
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "marketlens"
database_id = "72f2d530-b4a7-4b99-b8bb-6d3ccec39ae2"

# Set the admin token as a SECRET, not here:
#   wrangler secret put REFRESH_TOKEN
# Realm data arrives via POST /admin/import-realm (see tools/upload-realm.ps1).
